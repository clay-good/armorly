<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>framework-owned ads fixture</title>
</head>
<body>
  <!-- Chat apps are mostly React. React keeps references to the nodes it
       rendered and, on the next re-render, calls parent.removeChild(node)
       on them. If an ad blocker already detached that node, removeChild
       throws and React unmounts the whole app (blank page). This fixture
       replays that step without loading React. -->
  <div id="chat">
    <p id="answer">Here are three hotels near Shibuya.</p>
    <div id="ad-gate" data-imprezia-viewability-gate="true">
      <a class="imprezia-card imprezia-card-vertical" rel="noopener noreferrer sponsored" href="https://go.imprezia.ai/go/x">
        <span>Ad</span><span>Sponsored by Trip.com</span>
      </a>
    </div>
  </div>
  <script>
    var chat = document.getElementById('chat');
    var adNode = document.getElementById('ad-gate'); // React's fiber ref
    window.__rerender = function () {
      try {
        chat.removeChild(adNode); // what React's commitDeletion does
        return 'ok';
      } catch (e) {
        return String(e && e.message);
      }
    };
  </script>
</body>
</html>
